# DecapBridge PKCE authentication
backend:
  name: git-gateway
  repo: imsfraneinfo/imsfraneinfo
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/675b3ac4-7832-4dc9-a66f-c8010bd8af97/pkce
  auth_token_endpoint: /sites/675b3ac4-7832-4dc9-a66f-c8010bd8af97/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: 'Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://imsfrane.com
display_url: https://imsfrane.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "blog_fr"
    label: "📰 Blog Français"
    files:
      - label: "Gérer les articles"
        name: "articles_fr"
        file: "content/blog-fr.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}} — {{fields.publish_at}}"
            minimize_collapsed: true
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Identifiant URL (ex: rafting-printemps)", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', 'Utilisez seulement lettres minuscules, chiffres et tirets']}
              - {label: "Catégorie", name: "category", widget: "select", options: ["Montagne", "Rafting", "Randonnée", "Cascade", "Rivière", "Village", "Culture", "Conseils", "Autre"]}
              - {label: "Image principale", name: "image", widget: "image"}
              - {label: "Résumé", name: "summary", widget: "text"}
              - {label: "Contenu de l’article", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list"]}
              - {label: "Date et heure de publication", name: "publish_at", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false}
              - {label: "Publier", name: "published", widget: "boolean", default: true, hint: "Désactivez pour garder l’article caché. Si la date est future, il apparaîtra automatiquement à cette date."}
              - {label: "Titre SEO", name: "seo_title", widget: "string", required: false}
              - {label: "Description SEO", name: "seo_description", widget: "text", required: false}

  - name: "blog_en"
    label: "📰 English Blog"
    files:
      - label: "Manage articles"
        name: "articles_en"
        file: "content/blog-en.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}} — {{fields.publish_at}}"
            minimize_collapsed: true
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "URL slug (example: spring-rafting)", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', 'Use lowercase letters, numbers and hyphens only']}
              - {label: "Category", name: "category", widget: "select", options: ["Mountain", "Rafting", "Hiking", "Waterfall", "River", "Village", "Culture", "Tips", "Other"]}
              - {label: "Main image", name: "image", widget: "image"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Article content", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list"]}
              - {label: "Publication date and time", name: "publish_at", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false}
              - {label: "Publish", name: "published", widget: "boolean", default: true, hint: "Turn off to keep hidden. A future date will make the article appear automatically at that time."}
              - {label: "SEO title", name: "seo_title", widget: "string", required: false}
              - {label: "SEO description", name: "seo_description", widget: "text", required: false}

  - name: "advanced_fr"
    label: "⚙️ Pages FR (avancé)"
    files:
      - label: "Accueil"
        name: "home_fr"
        file: "fr/index.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "Rafting"
        name: "rafting_fr"
        file: "fr/rafting.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "Randonnée"
        name: "randonnee_fr"
        file: "fr/randonnee.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "Camping"
        name: "camping_fr"
        file: "fr/camping.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "VTT"
        name: "vtt_fr"
        file: "fr/vtt.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "Quad"
        name: "quad_fr"
        file: "fr/quad.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]

  - name: "advanced_en"
    label: "⚙️ English Pages (advanced)"
    files:
      - label: "Home"
        name: "home_en"
        file: "en/index.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
      - label: "Rafting"
        name: "rafting_en"
        file: "en/rafting.html"
        fields: [{label: "HTML", name: "body", widget: "code", default_language: "html", output_code_only: true}]
