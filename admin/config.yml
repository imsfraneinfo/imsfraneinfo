# DecapBridge PKCE authentication
backend:
  name: git-gateway
  repo: imsfraneinfo/imsfraneinfo
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/675b3ac4-7832-4dc9-a66f-c8010bd8af97/pkce
  auth_token_endpoint: /sites/675b3ac4-7832-4dc9-a66f-c8010bd8af97/token
  gateway_url: https://gateway.decapbridge.com

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://imsfrane.com
display_url: https://imsfrane.com
media_folder: "images/uploads"
public_folder: "/images/uploads"
publish_mode: simple

collections:
  - name: "easy_admin"
    label: "Office Admin — FR + EN"
    files:
      - label: "Contenu bilingue / Bilingual content"
        name: "site_content"
        file: "content/site-content.json"
        format: "json"
        fields:
          - label: "Contact (commun aux 2 langues)"
            name: "settings"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Téléphone / Phone", name: "phone", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "WhatsApp (sans +)", name: "whatsapp", widget: "string"}
          - label: "Activités — Français + English"
            name: "activities"
            widget: "object"
            collapsed: false
            fields:
              - label: "🌊 Rafting"
                name: "rafting"
                widget: "object"
                collapsed: true
                fields:
                  - label: "🇫🇷 Français"
                    name: "fr"
                    widget: "object"
                    collapsed: false
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - label: "Prix"
                        name: "prices"
                        widget: "list"
                        field: {label: "Prix", name: "price", widget: "string"}
                  - label: "🇬🇧 English"
                    name: "en"
                    widget: "object"
                    collapsed: false
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - label: "Prices"
