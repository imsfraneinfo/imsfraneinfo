# CloudCannon — Imsfrane Cathédrale
# Simple visual CMS: pages + real HTML article collections (no JSON array CMS)
collections_config:
  pages_fr:
    path: fr
    glob:
      - "*.html"
      - "!blog-*.html"
      - "!article.html"
    name: "🇫🇷 Pages FR"
    singular_name: "Page FR"
    icon: language
    disable_add: true
    _enabled_editors:
      - visual
      - source

  articles_fr:
    path: fr
    glob:
      - "blog-*.html"
    name: "📝 Articles FR"
    singular_name: "Article FR"
    icon: edit_note
    disable_add_folder: true
    _enabled_editors:
      - visual
      - source
    schemas:
      article_fr:
        path: .cloudcannon/schemas/article-fr.html
        name: "Nouvel article FR"
        icon: post_add
    add_options:
      - name: "Nouvel article FR"
        icon: post_add
        schema: article_fr
        editor: visual

  pages_en:
    path: en
    glob:
      - "*.html"
      - "!blog-*.html"
      - "!article.html"
    name: "🇬🇧 Pages EN"
    singular_name: "Page EN"
    icon: language
    disable_add: true
    _enabled_editors:
      - visual
      - source

  articles_en:
    path: en
    glob:
      - "blog-*.html"
    name: "📝 Articles EN"
    singular_name: "Article EN"
    icon: edit_note
    disable_add_folder: true
    _enabled_editors:
      - visual
      - source
    schemas:
      article_en:
        path: .cloudcannon/schemas/article-en.html
        name: "New English article"
        icon: post_add
    add_options:
      - name: "New English article"
        icon: post_add
        schema: article_en
        editor: visual

collection_groups:
  - heading: "🇫🇷 Français"
    collections:
      - pages_fr
      - articles_fr
  - heading: "🇬🇧 English"
    collections:
      - pages_en
      - articles_en

paths:
  uploads: /images
  static: /

_editables:
  text:
    bold: true
    italic: true
    link: true
  block:
    format: p h2 h3 h4
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
  image:
    expandable: true
    paths:
      uploads: /images
      static: /
