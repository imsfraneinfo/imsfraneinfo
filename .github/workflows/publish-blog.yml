name: Publish CloudCannon blog posts
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/build_blog.py'
      - '.github/workflows/publish-blog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7' 'mistune>=3,<4'
      - run: python scripts/build_blog.py
      - name: Commit generated HTML
        run: |
          git config user.name 'imsfrane blog publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add fr/blog.html en/blog.html fr/blog-*.html en/blog-*.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish CloudCannon blog articles'
            git push
          fi
