name: Publish approved identity and About page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-about-team.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: imsfrane-production-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download approved source version
        run: |
          git init /tmp/approved-design
          git -C /tmp/approved-design remote add origin https://github.com/imsfraneinfo/Imsfrane-demo.git
          git -C /tmp/approved-design fetch --depth 1 origin 0d50c058807179754ebbf52465d9e34ee8aacaa6
          git -C /tmp/approved-design checkout FETCH_HEAD
      - name: Apply approved About and identity to official pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, runpy, re
          root=Path(os.environ['GITHUB_WORKSPACE'])
          cname=(root/'CNAME').read_bytes()
          # Preserve search-engine metadata and all existing official content.
          before={}
          for p in root.rglob('*.html'):
              s=p.read_text()
              before[p]=re.findall(r'<(?:meta|link)\b[^>]*(?:robots|canonical)[^>]*>',s,re.I)
          os.chdir('/tmp/approved-design')
          about=runpy.run_path('build_about_team.py')
          about['build'].__globals__['BASE']='/'
          about['build'](root)
          visual=Path('build_visual_identity.py').read_text().replace('/Imsfrane-demo/','/')
          scope={'__name__':'approved_identity'}
          exec(compile(visual,'approved_identity','exec'),scope)
          scope['build'](root)
          for p,metadata in before.items():
              assert re.findall(r'<(?:meta|link)\b[^>]*(?:robots|canonical)[^>]*>',p.read_text(),re.I)==metadata, str(p)
          for lang in ('fr','en','ar','es'):
              s=(root/lang/'about/index.html').read_text()
              assert s.count('class="person-card"')==4
              assert 'class="founder-hero"' in s
              assert s.index('id="people"')<s.index('id="our-story"')
              assert '/Imsfrane-demo/' not in s
          assert (root/'CNAME').read_bytes()==cname
          print('Verified four About pages, four managers, founder hero, and preserved official SEO metadata.')
          PY
      - name: Commit approved design
        run: |
          git config user.name "imsfrane-design-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' '*.css' images/team/
          if git diff --cached --quiet; then
            echo "Approved design already published."
          else
            git commit -m "Publish approved visual identity, contrast fixes and founder-first About page"
            git push origin HEAD:main
          fi
